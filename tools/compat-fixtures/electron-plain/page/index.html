<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>빙수 시험 기본</title>
<style>
  html, body { margin: 0; height: 100%; background: #10331f; color: #fff; font: 22px/1.5 -apple-system, sans-serif; overflow: hidden; }
  #hud { position: absolute; left: 16px; top: 12px; }
  #me { position: absolute; width: 40px; height: 40px; background: #fc4; border-radius: 8px; }
  .ok { color: #8f8; } .fail { color: #f88; }
</style>
</head>
<body>
<div id="hud">
  <div>빙수 시험 기본 · 화살표로 움직이고 탭하면 그 자리로 · <span id="size"></span></div>
  <div>켠 횟수: <b id="runs">-</b> · 걸음: <b id="steps">0</b></div>
  <div id="log"></div>
</div>
<div id="me"></div>
<script src="game.js"></script>
</body>
</html>

name: BingsuApp
options:
  bundleIdPrefix: com.minwoo
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "30"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: "0.9.19"
  # 유리 효과 (iOS 26 은 Apple Liquid Glass glassEffect, 그 아래는 머티리얼 + 그라데이션 테두리). 2026-10-30 사용자 요청
  SwiftGlass:
    url: https://github.com/1998code/SwiftGlass
    exactVersion: "26.0.1"
targets:
  Bingsu:
    type: application
    platform: iOS
    sources:
      - path: Bingsu
        excludes: ["Resources/Rumble", "Resources/SampleGame", "Resources/IceBowl", "Resources/Skins"]
      # 게임별 효과음 진동표 (docs/rumble/README.md). 폴더째 번들에 넣어 `Rumble/<게임>.json` 으로 읽는다
      - path: Bingsu/Resources/Rumble
        type: folder
        buildPhase: resources
      # 가상 패드 스킨 (docs/skins/README.md). 폴더째 번들에 넣어 `Skins/<id>/skin.json` 으로 읽는다
      - path: Bingsu/Resources/Skins
        type: folder
        buildPhase: resources
      # 기본 게임 "Bingsu" (직접 만든 게임 + Phaser MIT). 폴더째 넣어 `SampleGame/dist/index.html` 로 연다
      - path: Bingsu/Resources/SampleGame
        type: folder
        buildPhase: resources
      # 가져오기 진행 그림 (Phaser 장면, Phaser 는 SampleGame/dist 것을 같이 씀). `IceBowl/index.html`
      - path: Bingsu/Resources/IceBowl
        type: folder
        buildPhase: resources
      # GPL 전문과 서드파티 고지 (설정 > 오픈소스 라이선스에서 그대로 보인다)
      - path: ../LICENSE
        buildPhase: resources
      - path: ../THIRD_PARTY_LICENSES.md
        buildPhase: resources
    dependencies:
      - package: ZIPFoundation
      - package: SwiftGlass
    # RPG Maker XP 실행기(BrassBowl.framework, mkxp-z GPLv3)는 링크하지 않고 넣기만 한다. 앱이 실행 중에 dlopen.
    # 만드는 법: BrassBowl/README.md. 없으면 경고만 하고 그 빌드는 RPG Maker XP 게임을 "준비 중"으로 보인다
    postBuildScripts:
      - name: BrassBowl 넣기
        script: sh "$SRCROOT/BrassBowl/embed-framework.sh"
        basedOnDependencyAnalysis: false
    # Google Drive OAuth 클라이언트 ID: Bingsu.xcconfig(커밋, 빈 기본값) 가 Secrets.xcconfig(gitignore) 를 `#include?` 로 읽는다.
    # Secrets.xcconfig 가 없어도 빌드되고 Drive 선택지만 "준비 중" (docs/drive/IMPLEMENTATION.md §6)
    configFiles:
      Debug: Bingsu.xcconfig
      Release: Bingsu.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.minwoo.bingsu
        PRODUCT_NAME: Bingsu   # 번들 이름은 영문 (한글이면 ipa 서명 봉인이 깨져 업로드 거부). 표시 이름은 CFBundleDisplayName
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iCloud Documents (저장 데이터 동기화, Freezer/Igloo.swift). 팀 ID 는 명령줄로만 넘긴다
        CODE_SIGN_ENTITLEMENTS: Bingsu/Bingsu.entitlements
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"
    info:
      path: Bingsu/Resources/Info.plist
      properties:
        CFBundleDisplayName: 빙수
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: ko
        # 파일 공유(나의 iPad › 빙수 노출)는 끈다: 켜 두면 iPad 에서 빙수가 띄운 파일 선택기가 빈 화면으로 멈춘다
        # (2026-10-29 끄면 정상, 2026-10-30 게임을 옮기고 앱을 새로 깔아 Documents 가 거의 비어도 재현). 저장 데이터는 설정의 백업 내보내기로 꺼낸다
        UIFileSharingEnabled: false
        LSSupportsOpeningDocumentsInPlace: true
        UIStatusBarHidden: true
        UILaunchScreen: {}
        UIViewControllerBasedStatusBarAppearance: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiresFullScreen: false
        # INFOPLIST_KEY_ 설정은 커스텀 Info.plist 에 안 들어가므로 여기 직접 (App Store 검증 90474)
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # 표준 HTTPS 외 암호화 없음 → App Store Connect 업로드 때 수출 규정 질문 생략
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: "같은 와이파이에서 게임의 온라인 방을 열거나 참가할 때 필요해요."
        CFBundleDocumentTypes:
          - CFBundleTypeName: "게임 압축 파일"
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.zip-archive]
          # 가상 패드 스킨 (docs/skins/README.md). Files 에서 열면 게임 가져오기와 같은 길로 들어와 스킨으로 갈린다
          - CFBundleTypeName: "빙수 패드 스킨"
            LSHandlerRank: Owner
            LSItemContentTypes: [com.minwoo.bingsu.skin]
        # Google Drive 연결 (Freezer/DriveTicket.swift). 값은 xcconfig 변수 — 클라이언트 ID 는 저장소에 두지 않는다 (PLAN 8.1)
        BINGSU_GOOGLE_CLIENT_ID: "$(BINGSU_GOOGLE_CLIENT_ID)"
        # 동의 화면의 되돌림 주소 스킴 (클라이언트 ID 를 뒤집은 것). ASWebAuthenticationSession 이 받으며, 그 밖에 열리면 무시한다
        CFBundleURLTypes:
          - CFBundleURLName: com.minwoo.bingsu.drive
            CFBundleURLSchemes: ["$(BINGSU_GOOGLE_REVERSED_CLIENT_ID)"]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.minwoo.bingsu.skin
            UTTypeDescription: "빙수 패드 스킨"
            UTTypeConformsTo: [public.zip-archive]
            UTTypeTagSpecification:
              public.filename-extension: [bingsuskin]

name: BingsuApp
options:
  bundleIdPrefix: com.minwoo
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "21"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: "0.9.19"
  # 유리 효과 (iOS 26 은 Apple Liquid Glass glassEffect, 그 아래는 머티리얼 + 그라데이션 테두리). 2026-10-30 사용자 요청
  SwiftGlass:
    url: https://github.com/1998code/SwiftGlass
    exactVersion: "26.0.1"
targets:
  Bingsu:
    type: application
    platform: iOS
    sources:
      - path: Bingsu
        excludes: ["Resources/Rumble", "Resources/SampleGame", "Resources/IceBowl"]
      # 게임별 효과음 진동표 (docs/rumble/README.md). 폴더째 번들에 넣어 `Rumble/<게임>.json` 으로 읽는다
      - path: Bingsu/Resources/Rumble
        type: folder
        buildPhase: resources
      # 기본 게임 "Bingsu" (직접 만든 게임 + Phaser MIT). 폴더째 넣어 `SampleGame/dist/index.html` 로 연다
      - path: Bingsu/Resources/SampleGame
        type: folder
        buildPhase: resources
      # 가져오기 진행 그림 (Phaser 장면, Phaser 는 SampleGame/dist 것을 같이 씀). `IceBowl/index.html`
      - path: Bingsu/Resources/IceBowl
        type: folder
        buildPhase: resources
      # GPL 전문과 서드파티 고지 (설정 > 오픈소스 라이선스에서 그대로 보인다)
      - path: ../LICENSE
        buildPhase: resources
      - path: ../THIRD_PARTY_LICENSES.md
        buildPhase: resources
    dependencies:
      - package: ZIPFoundation
      - package: SwiftGlass
    # RPG Maker XP 실행기(BrassBowl.framework, mkxp-z GPLv3)는 링크하지 않고 넣기만 한다. 앱이 실행 중에 dlopen.
    # 만드는 법: BrassBowl/README.md. 없으면 경고만 하고 그 빌드는 RPG Maker XP 게임을 "준비 중"으로 보인다
    postBuildScripts:
      - name: BrassBowl 넣기
        script: sh "$SRCROOT/BrassBowl/embed-framework.sh"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.minwoo.bingsu
        PRODUCT_NAME: Bingsu   # 번들 이름은 영문 (한글이면 ipa 서명 봉인이 깨져 업로드 거부). 표시 이름은 CFBundleDisplayName
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iCloud Documents (저장 데이터 동기화, Freezer/Igloo.swift). 팀 ID 는 명령줄로만 넘긴다
        CODE_SIGN_ENTITLEMENTS: Bingsu/Bingsu.entitlements
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"
    info:
      path: Bingsu/Resources/Info.plist
      properties:
        CFBundleDisplayName: 빙수
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: ko
        # 파일 공유(나의 iPad › 빙수 노출)는 끈다: 켜 두면 iPad 에서 빙수가 띄운 파일 선택기가 빈 화면으로 멈춘다
        # (2026-10-29 끄면 정상, 2026-10-30 게임을 옮기고 앱을 새로 깔아 Documents 가 거의 비어도 재현). 저장 데이터는 설정의 백업 내보내기로 꺼낸다
        UIFileSharingEnabled: false
        LSSupportsOpeningDocumentsInPlace: true
        UIStatusBarHidden: true
        UILaunchScreen: {}
        UIViewControllerBasedStatusBarAppearance: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiresFullScreen: false
        # INFOPLIST_KEY_ 설정은 커스텀 Info.plist 에 안 들어가므로 여기 직접 (App Store 검증 90474)
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # 표준 HTTPS 외 암호화 없음 → App Store Connect 업로드 때 수출 규정 질문 생략
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: "같은 네트워크의 방장 PC 서버로 온라인 방에 참가할 때 필요합니다."
        CFBundleDocumentTypes:
          - CFBundleTypeName: "게임 압축 파일"
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.zip-archive]
